<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <header class="site-header">
      <div class="container d-flex flex-wrap p-3 flex-column flex-md-row align-items-center">
        <a class="site-title navbar-brand me-auto" href="index.html">ITEC</a>
        <nav class="nav">
          <a class="nav-link" href="labs.html">Labs</a>
          <a class="nav-link" href="quizzes.html">Quizzes</a>
          <a class="nav-link" href="info.html">Information</a>
        </nav>
      </div>
    </header>
    <h1>Blood Reserves</h1>

    <label for="blood-group-abo">ABO Blood Group</label>
    <select id="blood-group-abo">
      <option value="A">A</option>
      <option value="AB">AB</option>
      <option value="B">B</option>
      <option value="O">O</option>
    </select>

    <br />

    <label for="blood-group-rh">Rh Factor</label>
    <select id="blood-group-rh">
      <option value="positive">Positive</option>
      <option value="negative">Negative</option>
    </select>

    <br />

    <button id="get-blood-units-button">Get blood units</button>

    <div id="display-blood-units">
      <p>Blood group: <span id="blood-group-display"></span></p>
      <p>Units available: <span id="units-available"></span></p>
    </div>
    <footer class="site-footer">
      <div class="container">
        <p class="mb-0">ITEC coursework &mdash; Oak Arboleda</p>
      </div>
    </footer>
    <script>
      let bloodGroupAboInput = document.querySelector('#blood-group-abo')
      let bloodGroupRhInput = document.querySelector('#blood-group-rh')

      let getBloodUnitsButton = document.querySelector('#get-blood-units-button')

      let bloodGroupDisplay = document.querySelector('#blood-group-display')
      let unitsAvailableDisplay = document.querySelector('#units-available')

      getBloodUnitsButton.addEventListener('click', function () {
        let aboGroupValude = bloodGroupAboInput.value
        let rhFactorValue = bloodGroupRhInput.value
        console.log('ABO Group:', aboGroupValude)
        console.log('Rh Factor:', rhFactorValue)

        let bloodType = aboGroupValude + (rhFactorValue === 'positive' ? '+' : '-')
        let apiGroup = aboGroupValude + rhFactorValue
        let apiUrl = `https://blood-group-api.wl.r.appspot.com/api/blood_units_by_group?group=${apiGroup}`
        console.log('API URL:', apiUrl)

        bloodGroupDisplay.textContent = bloodType
        unitsAvailableDisplay.textContent = 'Loading...'

        fetch(apiUrl)
          .then(function (response) {
            if (!response.ok) {
              throw new Error(`Blood supply request failed: ${response.status}`)
            }
            return response.json()
          })
          .then(function (data) {
            unitsAvailableDisplay.textContent = data.results.blood_availability.units_available
          })
          .catch(function (error) {
            console.error(error)
            unitsAvailableDisplay.textContent = 'Unable to retrieve blood supply'
          })
      })
    </script>
  </body>
</html>
