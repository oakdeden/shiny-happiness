name: Deploy student feedback app to Azure - ITEC

on:
  push:
    branches:
      - main
    paths:
      - 'tmp/feedback/**'
      - '.github/workflows/main_itec.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-itec
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tmp/feedback/package-lock.json

      - name: Install production dependencies
        run: npm ci --omit=dev
        working-directory: tmp/feedback

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ITEC
          slot-name: Production
          package: tmp/feedback
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_2ADA9EC7F7EF40358CE43F16026F17C7 }}
