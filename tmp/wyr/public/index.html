<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Would You Rather</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Manrope:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="stylesheets/style.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="panel" aria-labelledby="page-title">
        <div class="brand-mark">ITEC</div>
        <p class="eyebrow">Would You Rather</p>
        <h1 id="page-title">Pick one</h1>
        <p class="intro">
          The question below comes from the Would You Rather API. Choose an answer, then load
          another question anytime.
        </p>

        <p id="status" class="status" role="status" aria-live="polite">Loading a question…</p>
        <h2 id="question" class="question">Loading…</h2>

        <div class="choices">
          <button id="answer1" class="choice" type="button">—</button>
          <button id="answer2" class="choice" type="button">—</button>
        </div>

        <div class="actions">
          <button id="next-question" class="button" type="button">New question</button>
        </div>
      </section>
    </main>
    <script src="js/wyr.js" defer></script>
  </body>
</html>
